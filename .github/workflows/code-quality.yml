name: Code Quality Checks

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run weekly on Sundays at 2 AM UTC
    - cron: '0 2 * * 0'

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '18'

jobs:
  # Python code quality
  python-quality:
    name: Python Code Quality
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit mypy pylint
      
      - name: Run Black formatting check
        run: |
          cd backend
          black --check --diff app/ --config pyproject.toml
      
      - name: Run isort import sorting check
        run: |
          cd backend
          isort --check-only --diff app/ --settings-path pyproject.toml
      
      - name: Run flake8 linting
        run: |
          cd backend
          flake8 app/ --count --statistics --format=github --config=.flake8
      
      - name: Run Bandit security linting
        run: |
          cd backend
          bandit -r app/ -f json -o bandit-report.json
          bandit -r app/ -f txt
        continue-on-error: true
      
      - name: Run MyPy type checking
        run: |
          cd backend
          mypy app/ --config-file pyproject.toml
        continue-on-error: true
      
      - name: Run Pylint
        run: |
          cd backend
          pylint app/ --output-format=github --exit-zero
      
      - name: Upload Bandit results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-security-report
          path: backend/bandit-report.json
          retention-days: 30

  # JavaScript/TypeScript code quality
  javascript-quality:
    name: JavaScript/TypeScript Code Quality
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
      
      - name: Run ESLint
        run: |
          cd frontend
          npm run lint -- --format=github
      
      - name: Run Prettier format check
        run: |
          cd frontend
          npm run format:check
      
      - name: Run TypeScript compiler check
        run: |
          cd frontend
          npm run type-check
      
      - name: Check for unused dependencies
        run: |
          cd frontend
          npx depcheck --json > depcheck-report.json
          npx depcheck
        continue-on-error: true
      
      - name: Upload dependency check results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: depcheck-report
          path: frontend/depcheck-report.json
          retention-days: 30

  # Dependency vulnerability scanning
  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install Safety
        run: pip install safety
      
      - name: Run Python dependency scan
        run: |
          cd backend
          safety check -r requirements.txt --json --output safety-report.json
          safety check -r requirements.txt
        continue-on-error: true
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: Run npm audit
        run: |
          cd frontend
          npm audit --json > npm-audit-report.json
          npm audit --audit-level=moderate
        continue-on-error: true
      
      - name: Upload vulnerability reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vulnerability-reports
          path: |
            backend/safety-report.json
            frontend/npm-audit-report.json
          retention-days: 30

  # Code complexity analysis
  complexity-analysis:
    name: Code Complexity Analysis
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install complexity tools
        run: |
          pip install radon xenon
      
      - name: Run Python complexity analysis
        run: |
          cd backend
          echo "=== Cyclomatic Complexity ==="
          radon cc app/ -a -nc
          echo "=== Maintainability Index ==="
          radon mi app/ -nc
          echo "=== Raw Metrics ==="
          radon raw app/ -s
          echo "=== Xenon Complexity Check ==="
          xenon --max-absolute B --max-modules A --max-average A app/
        continue-on-error: true
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci
      
      - name: Install complexity tools for JavaScript
        run: |
          npm install -g complexity-report
      
      - name: Run JavaScript complexity analysis
        run: |
          cd frontend
          echo "=== TypeScript/JavaScript Complexity ==="
          cr --format json --output complexity-report.json src/
          cr src/
        continue-on-error: true
      
      - name: Upload complexity reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: complexity-reports
          path: frontend/complexity-report.json
          retention-days: 30

  # Documentation quality
  documentation-quality:
    name: Documentation Quality
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Check for README files
        run: |
          echo "=== Checking for documentation files ==="
          find . -name "README*" -type f
          find . -name "*.md" -type f | head -20
      
      - name: Install markdown linter
        run: |
          npm install -g markdownlint-cli
      
      - name: Run markdown linting
        run: |
          markdownlint "**/*.md" --ignore node_modules --ignore .venv
        continue-on-error: true
      
      - name: Check Python docstrings
        run: |
          pip install pydocstyle
          cd backend
          pydocstyle app/ --count --explain --source
        continue-on-error: true

  # License compliance
  license-check:
    name: License Compliance
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install license checker
        run: |
          pip install pip-licenses
      
      - name: Check Python licenses
        run: |
          cd backend
          pip install -r requirements.txt
          pip-licenses --format=json --output-file=python-licenses.json
          pip-licenses --format=markdown --output-file=python-licenses.md
          echo "=== Python Package Licenses ==="
          pip-licenses
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: Install license checker for Node.js
        run: |
          npm install -g license-checker
      
      - name: Check JavaScript licenses
        run: |
          cd frontend
          npm ci
          license-checker --json --out javascript-licenses.json
          license-checker --markdown --out javascript-licenses.md
          echo "=== JavaScript Package Licenses ==="
          license-checker --summary
      
      - name: Upload license reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: license-reports
          path: |
            backend/python-licenses.*
            frontend/javascript-licenses.*
          retention-days: 30

  # Performance analysis
  performance-analysis:
    name: Performance Analysis
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install performance tools
        run: |
          pip install py-spy memory-profiler
      
      - name: Analyze Python imports
        run: |
          cd backend
          pip install -r requirements.txt
          echo "=== Import time analysis ==="
          python -X importtime -c "import app.main" 2> import-time.log
          cat import-time.log | head -20
        continue-on-error: true
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci
      
      - name: Analyze bundle size
        run: |
          cd frontend
          npm run build
          echo "=== Bundle size analysis ==="
          du -sh .next/static/chunks/* | sort -hr | head -10
        continue-on-error: true
      
      - name: Upload performance reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-reports
          path: backend/import-time.log
          retention-days: 30

  # Generate quality report
  quality-report:
    name: Generate Quality Report
    runs-on: ubuntu-latest
    needs: [python-quality, javascript-quality, dependency-scan, complexity-analysis, documentation-quality, license-check, performance-analysis]
    if: always()
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
      
      - name: Generate quality summary
        run: |
          echo "# Code Quality Report" > quality-report.md
          echo "Generated on: $(date)" >> quality-report.md
          echo "" >> quality-report.md
          
          echo "## Job Results" >> quality-report.md
          echo "- Python Quality: ${{ needs.python-quality.result }}" >> quality-report.md
          echo "- JavaScript Quality: ${{ needs.javascript-quality.result }}" >> quality-report.md
          echo "- Dependency Scan: ${{ needs.dependency-scan.result }}" >> quality-report.md
          echo "- Complexity Analysis: ${{ needs.complexity-analysis.result }}" >> quality-report.md
          echo "- Documentation Quality: ${{ needs.documentation-quality.result }}" >> quality-report.md
          echo "- License Check: ${{ needs.license-check.result }}" >> quality-report.md
          echo "- Performance Analysis: ${{ needs.performance-analysis.result }}" >> quality-report.md
          echo "" >> quality-report.md
          
          echo "## Artifacts Generated" >> quality-report.md
          echo "The following reports have been generated:" >> quality-report.md
          find . -name "*.json" -o -name "*.md" -o -name "*.log" | sort >> quality-report.md
          
          cat quality-report.md
      
      - name: Upload quality report
        uses: actions/upload-artifact@v4
        with:
          name: quality-report
          path: quality-report.md
          retention-days: 30
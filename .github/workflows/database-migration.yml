name: Database Migration

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - staging
          - production
      migration_type:
        description: 'Migration type'
        required: true
        default: 'upgrade'
        type: choice
        options:
          - upgrade
          - downgrade
          - reset
      target_revision:
        description: 'Target revision (for downgrade/specific upgrade)'
        required: false
        type: string
      dry_run:
        description: 'Dry run (show what would be executed)'
        required: false
        default: false
        type: boolean
  
  # Automatically run on push to main (for staging)
  push:
    branches:
      - main
    paths:
      - 'backend/alembic/versions/**'
      - 'backend/alembic/env.py'
      - 'backend/alembic.ini'

env:
  AWS_REGION: us-east-1
  PROJECT_NAME: revive-ai

jobs:
  # Validate migration
  validate-migration:
    name: Validate Migration
    runs-on: ubuntu-latest
    
    outputs:
      environment: ${{ steps.validate.outputs.environment }}
      migration_command: ${{ steps.validate.outputs.migration_command }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Validate inputs
        id: validate
        run: |
          ENVIRONMENT="${{ github.event.inputs.environment }}"
          MIGRATION_TYPE="${{ github.event.inputs.migration_type }}"
          TARGET_REVISION="${{ github.event.inputs.target_revision }}"
          DRY_RUN="${{ github.event.inputs.dry_run }}"
          
          echo "environment=$ENVIRONMENT" >> $GITHUB_OUTPUT
          
          # Build migration command
          case $MIGRATION_TYPE in
            "upgrade")
              if [ -n "$TARGET_REVISION" ]; then
                COMMAND="alembic upgrade $TARGET_REVISION"
              else
                COMMAND="alembic upgrade head"
              fi
              ;;
            "downgrade")
              if [ -z "$TARGET_REVISION" ]; then
                echo "Target revision is required for downgrade"
                exit 1
              fi
              COMMAND="alembic downgrade $TARGET_REVISION"
              ;;
            "reset")
              COMMAND="alembic downgrade base && alembic upgrade head"
              ;;
            *)
              echo "Invalid migration type: $MIGRATION_TYPE"
              exit 1
              ;;
          esac
          
          if [ "$DRY_RUN" = "true" ]; then
            COMMAND="$COMMAND --sql"
          fi
          
          echo "migration_command=$COMMAND" >> $GITHUB_OUTPUT
          echo "Migration command: $COMMAND"
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
      
      - name: Validate migration files
        run: |
          cd backend
          # Check for syntax errors in migration files
          python -m py_compile alembic/versions/*.py
          
          # Validate alembic configuration
          alembic check
        env:
          DATABASE_URL: sqlite:///temp.db

  # Backup database (production only)
  backup-database:
    name: Backup Database
    runs-on: ubuntu-latest
    needs: [validate-migration]
    if: needs.validate-migration.outputs.environment == 'production'
    
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Create RDS snapshot
        run: |
          ENVIRONMENT="${{ needs.validate-migration.outputs.environment }}"
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          SNAPSHOT_ID="${{ env.PROJECT_NAME }}-${ENVIRONMENT}-migration-backup-${TIMESTAMP}"
          DB_INSTANCE_ID="${{ env.PROJECT_NAME }}-${ENVIRONMENT}-db"
          
          echo "Creating RDS snapshot: $SNAPSHOT_ID"
          aws rds create-db-snapshot \
            --db-instance-identifier $DB_INSTANCE_ID \
            --db-snapshot-identifier $SNAPSHOT_ID
          
          echo "Waiting for snapshot to complete..."
          aws rds wait db-snapshot-completed \
            --db-snapshot-identifier $SNAPSHOT_ID
          
          echo "Snapshot created successfully: $SNAPSHOT_ID"
          echo "snapshot_id=$SNAPSHOT_ID" >> $GITHUB_ENV
      
      - name: Verify snapshot
        run: |
          aws rds describe-db-snapshots \
            --db-snapshot-identifier ${{ env.snapshot_id }} \
            --query 'DBSnapshots[0].Status' \
            --output text

  # Run migration
  run-migration:
    name: Run Database Migration
    runs-on: ubuntu-latest
    needs: [validate-migration, backup-database]
    if: always() && needs.validate-migration.result == 'success' && (needs.backup-database.result == 'success' || needs.backup-database.result == 'skipped')
    environment:
      name: ${{ needs.validate-migration.outputs.environment }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Get database connection info
        run: |
          ENVIRONMENT="${{ needs.validate-migration.outputs.environment }}"
          
          # Get RDS endpoint
          DB_ENDPOINT=$(aws rds describe-db-instances \
            --db-instance-identifier ${{ env.PROJECT_NAME }}-${ENVIRONMENT}-db \
            --query 'DBInstances[0].Endpoint.Address' \
            --output text)
          
          echo "DB_ENDPOINT=$DB_ENDPOINT" >> $GITHUB_ENV
          echo "Database endpoint: $DB_ENDPOINT"
      
      - name: Run migration in ECS task
        run: |
          ENVIRONMENT="${{ needs.validate-migration.outputs.environment }}"
          MIGRATION_COMMAND="${{ needs.validate-migration.outputs.migration_command }}"
          
          # Get network configuration
          SUBNET_ID=$(aws ec2 describe-subnets \
            --filters "Name=tag:Name,Values=${{ env.PROJECT_NAME }}-${ENVIRONMENT}-private-subnet-1" \
            --query 'Subnets[0].SubnetId' --output text)
          
          SECURITY_GROUP_ID=$(aws ec2 describe-security-groups \
            --filters "Name=tag:Name,Values=${{ env.PROJECT_NAME }}-${ENVIRONMENT}-ecs-sg" \
            --query 'SecurityGroups[0].GroupId' --output text)
          
          # Prepare command override
          COMMAND_ARRAY=$(echo "$MIGRATION_COMMAND" | jq -R 'split(" ")')
          
          # Run migration task
          echo "Running migration: $MIGRATION_COMMAND"
          TASK_ARN=$(aws ecs run-task \
            --cluster ${{ env.PROJECT_NAME }}-${ENVIRONMENT}-cluster \
            --task-definition ${{ env.PROJECT_NAME }}-${ENVIRONMENT}-backend \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNET_ID],securityGroups=[$SECURITY_GROUP_ID],assignPublicIp=DISABLED}" \
            --overrides "{\"containerOverrides\":[{\"name\":\"${{ env.PROJECT_NAME }}-${ENVIRONMENT}-backend\",\"command\":$COMMAND_ARRAY}]}" \
            --query 'tasks[0].taskArn' --output text)
          
          echo "Migration task ARN: $TASK_ARN"
          echo "TASK_ARN=$TASK_ARN" >> $GITHUB_ENV
      
      - name: Wait for migration completion
        run: |
          echo "Waiting for migration task to complete..."
          aws ecs wait tasks-stopped \
            --cluster ${{ env.PROJECT_NAME }}-${{ needs.validate-migration.outputs.environment }}-cluster \
            --tasks ${{ env.TASK_ARN }}
          
          # Get task details
          TASK_DETAILS=$(aws ecs describe-tasks \
            --cluster ${{ env.PROJECT_NAME }}-${{ needs.validate-migration.outputs.environment }}-cluster \
            --tasks ${{ env.TASK_ARN }})
          
          EXIT_CODE=$(echo "$TASK_DETAILS" | jq -r '.tasks[0].containers[0].exitCode')
          STOP_REASON=$(echo "$TASK_DETAILS" | jq -r '.tasks[0].stoppedReason // "N/A"')
          
          echo "Migration task exit code: $EXIT_CODE"
          echo "Stop reason: $STOP_REASON"
          
          if [ "$EXIT_CODE" != "0" ]; then
            echo "Migration failed with exit code: $EXIT_CODE"
            exit 1
          fi
          
          echo "Migration completed successfully!"
      
      - name: Get migration logs
        run: |
          # Get log group name
          LOG_GROUP="/ecs/${{ env.PROJECT_NAME }}-${{ needs.validate-migration.outputs.environment }}-backend"
          
          # Get log stream name from task
          LOG_STREAM=$(aws ecs describe-tasks \
            --cluster ${{ env.PROJECT_NAME }}-${{ needs.validate-migration.outputs.environment }}-cluster \
            --tasks ${{ env.TASK_ARN }} \
            --query 'tasks[0].containers[0].name' --output text)
          
          TASK_ID=$(echo "${{ env.TASK_ARN }}" | cut -d'/' -f3)
          LOG_STREAM_NAME="ecs/${LOG_STREAM}/${TASK_ID}"
          
          echo "Fetching migration logs..."
          aws logs get-log-events \
            --log-group-name "$LOG_GROUP" \
            --log-stream-name "$LOG_STREAM_NAME" \
            --query 'events[].message' \
            --output text || echo "Could not fetch logs"

  # Verify migration
  verify-migration:
    name: Verify Migration
    runs-on: ubuntu-latest
    needs: [validate-migration, run-migration]
    if: success() && github.event.inputs.dry_run != 'true'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Verify database schema
        run: |
          ENVIRONMENT="${{ needs.validate-migration.outputs.environment }}"
          
          # Get network configuration
          SUBNET_ID=$(aws ec2 describe-subnets \
            --filters "Name=tag:Name,Values=${{ env.PROJECT_NAME }}-${ENVIRONMENT}-private-subnet-1" \
            --query 'Subnets[0].SubnetId' --output text)
          
          SECURITY_GROUP_ID=$(aws ec2 describe-security-groups \
            --filters "Name=tag:Name,Values=${{ env.PROJECT_NAME }}-${ENVIRONMENT}-ecs-sg" \
            --query 'SecurityGroups[0].GroupId' --output text)
          
          # Run schema verification
          VERIFY_TASK_ARN=$(aws ecs run-task \
            --cluster ${{ env.PROJECT_NAME }}-${ENVIRONMENT}-cluster \
            --task-definition ${{ env.PROJECT_NAME }}-${ENVIRONMENT}-backend \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNET_ID],securityGroups=[$SECURITY_GROUP_ID],assignPublicIp=DISABLED}" \
            --overrides '{"containerOverrides":[{"name":"${{ env.PROJECT_NAME }}-'${ENVIRONMENT}'-backend","command":["alembic","current"]}]}' \
            --query 'tasks[0].taskArn' --output text)
          
          # Wait for verification
          aws ecs wait tasks-stopped \
            --cluster ${{ env.PROJECT_NAME }}-${ENVIRONMENT}-cluster \
            --tasks $VERIFY_TASK_ARN
          
          # Check result
          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster ${{ env.PROJECT_NAME }}-${ENVIRONMENT}-cluster \
            --tasks $VERIFY_TASK_ARN \
            --query 'tasks[0].containers[0].exitCode' --output text)
          
          if [ "$EXIT_CODE" != "0" ]; then
            echo "Schema verification failed"
            exit 1
          fi
          
          echo "Schema verification passed"
      
      - name: Run application health check
        run: |
          ENVIRONMENT="${{ needs.validate-migration.outputs.environment }}"
          
          if [ "$ENVIRONMENT" = "production" ]; then
            HEALTH_URL="https://api.${{ secrets.DOMAIN_NAME }}/health"
          else
            HEALTH_URL="https://${ENVIRONMENT}-api.revive-ai.com/health"
          fi
          
          echo "Checking application health at: $HEALTH_URL"
          
          # Wait for application to be healthy
          for i in {1..10}; do
            if curl -f -s "$HEALTH_URL" > /dev/null; then
              echo "✅ Application health check passed"
              break
            else
              echo "⏳ Waiting for application to be healthy... (attempt $i/10)"
              sleep 30
            fi
            
            if [ $i -eq 10 ]; then
              echo "❌ Application health check failed after migration"
              exit 1
            fi
          done

  # Rollback on failure
  rollback-migration:
    name: Rollback Migration
    runs-on: ubuntu-latest
    needs: [validate-migration, backup-database, run-migration, verify-migration]
    if: failure() && needs.backup-database.result == 'success' && needs.validate-migration.outputs.environment == 'production'
    environment:
      name: ${{ needs.validate-migration.outputs.environment }}
    
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Restore from snapshot
        run: |
          ENVIRONMENT="${{ needs.validate-migration.outputs.environment }}"
          DB_INSTANCE_ID="${{ env.PROJECT_NAME }}-${ENVIRONMENT}-db"
          
          # Get the latest backup snapshot
          SNAPSHOT_ID=$(aws rds describe-db-snapshots \
            --db-instance-identifier $DB_INSTANCE_ID \
            --query 'DBSnapshots | sort_by(@, &SnapshotCreateTime) | [-1].DBSnapshotIdentifier' \
            --output text)
          
          echo "Rolling back to snapshot: $SNAPSHOT_ID"
          
          # Create a new DB instance from snapshot
          RESTORE_ID="${DB_INSTANCE_ID}-restore-$(date +%Y%m%d-%H%M%S)"
          
          aws rds restore-db-instance-from-db-snapshot \
            --db-instance-identifier $RESTORE_ID \
            --db-snapshot-identifier $SNAPSHOT_ID
          
          echo "Database rollback initiated. Manual intervention required to complete the process."
          echo "Restore instance ID: $RESTORE_ID"

  # Notify results
  notify-results:
    name: Notify Migration Results
    runs-on: ubuntu-latest
    needs: [validate-migration, backup-database, run-migration, verify-migration, rollback-migration]
    if: always()
    
    steps:
      - name: Notify success
        if: needs.verify-migration.result == 'success' || (github.event.inputs.dry_run == 'true' && needs.run-migration.result == 'success')
        run: |
          echo "✅ Database migration completed successfully!"
          echo "Environment: ${{ needs.validate-migration.outputs.environment }}"
          echo "Command: ${{ needs.validate-migration.outputs.migration_command }}"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "Note: This was a dry run - no actual changes were made"
          fi
      
      - name: Notify failure
        if: failure()
        run: |
          echo "❌ Database migration failed!"
          echo "Environment: ${{ needs.validate-migration.outputs.environment }}"
          echo "Command: ${{ needs.validate-migration.outputs.migration_command }}"
          echo "Please check the logs and take appropriate action."
          
          if [ "${{ needs.rollback-migration.result }}" = "success" ]; then
            echo "Automatic rollback was initiated for production."
          fi
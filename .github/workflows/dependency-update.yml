name: Dependency Updates

on:
  # Schedule disabled - enable when ready for automated dependency updates
  # schedule:
  #   # Run weekly on Mondays at 9 AM UTC
  #   - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      update_type:
        description: 'Type of update'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
          - all
      create_pr:
        description: 'Create pull request for updates'
        required: false
        default: true
        type: boolean

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '18'

jobs:
  # Check for Python dependency updates
  python-dependency-check:
    name: Python Dependency Check
    runs-on: ubuntu-latest
    
    outputs:
      has_updates: ${{ steps.check.outputs.has_updates }}
      updates_summary: ${{ steps.check.outputs.updates_summary }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install pip-tools and safety
        run: |
          pip install --upgrade pip
          pip install pip-tools safety pip-audit
      
      - name: Check for outdated packages
        id: check
        run: |
          cd backend
          
          # Install current dependencies
          pip install -r requirements.txt
          
          # Check for outdated packages
          echo "=== Checking for outdated Python packages ==="
          pip list --outdated --format=json > outdated.json
          
          # Parse outdated packages
          OUTDATED_COUNT=$(jq length outdated.json)
          echo "Found $OUTDATED_COUNT outdated packages"
          
          if [ $OUTDATED_COUNT -gt 0 ]; then
            echo "has_updates=true" >> $GITHUB_OUTPUT
            
            # Generate summary
            echo "## Python Package Updates Available" > ../python-updates.md
            echo "" >> ../python-updates.md
            echo "| Package | Current | Latest | Type |" >> ../python-updates.md
            echo "|---------|---------|--------|------|" >> ../python-updates.md
            
            jq -r '.[] | "| \(.name) | \(.version) | \(.latest_version) | \(.latest_filetype) |"' outdated.json >> ../python-updates.md
            
            UPDATES_SUMMARY=$(cat ../python-updates.md)
            echo "updates_summary<<EOF" >> $GITHUB_OUTPUT
            echo "$UPDATES_SUMMARY" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "has_updates=false" >> $GITHUB_OUTPUT
            echo "updates_summary=No Python package updates available" >> $GITHUB_OUTPUT
          fi
      
      - name: Security audit
        run: |
          cd backend
          echo "=== Running Python security audit ==="
          
          # Run safety check
          safety check -r requirements.txt --json --output safety-report.json || true
          safety check -r requirements.txt || true
          
          # Run pip-audit
          pip-audit --format=json --output=pip-audit-report.json || true
          pip-audit || true
        continue-on-error: true
      
      - name: Upload Python reports
        uses: actions/upload-artifact@v4
        with:
          name: python-dependency-reports
          path: |
            backend/outdated.json
            backend/safety-report.json
            backend/pip-audit-report.json
            python-updates.md
          retention-days: 30

  # Check for Node.js dependency updates
  nodejs-dependency-check:
    name: Node.js Dependency Check
    runs-on: ubuntu-latest
    
    outputs:
      has_updates: ${{ steps.check.outputs.has_updates }}
      updates_summary: ${{ steps.check.outputs.updates_summary }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
      
      - name: Check for outdated packages
        id: check
        run: |
          cd frontend
          
          echo "=== Checking for outdated Node.js packages ==="
          npm outdated --json > outdated.json || true
          
          # Check if there are updates
          if [ -s outdated.json ] && [ "$(cat outdated.json)" != "{}" ]; then
            echo "has_updates=true" >> $GITHUB_OUTPUT
            
            # Generate summary
            echo "## Node.js Package Updates Available" > ../nodejs-updates.md
            echo "" >> ../nodejs-updates.md
            echo "| Package | Current | Wanted | Latest | Location |" >> ../nodejs-updates.md
            echo "|---------|---------|--------|--------|----------|" >> ../nodejs-updates.md
            
            jq -r 'to_entries[] | "| \(.key) | \(.value.current // "N/A") | \(.value.wanted // "N/A") | \(.value.latest // "N/A") | \(.value.location // "N/A") |"' outdated.json >> ../nodejs-updates.md
            
            UPDATES_SUMMARY=$(cat ../nodejs-updates.md)
            echo "updates_summary<<EOF" >> $GITHUB_OUTPUT
            echo "$UPDATES_SUMMARY" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "has_updates=false" >> $GITHUB_OUTPUT
            echo "updates_summary=No Node.js package updates available" >> $GITHUB_OUTPUT
          fi
      
      - name: Security audit
        run: |
          cd frontend
          echo "=== Running Node.js security audit ==="
          
          # Run npm audit
          npm audit --json > npm-audit-report.json || true
          npm audit || true
        continue-on-error: true
      
      - name: Upload Node.js reports
        uses: actions/upload-artifact@v4
        with:
          name: nodejs-dependency-reports
          path: |
            frontend/outdated.json
            frontend/npm-audit-report.json
            nodejs-updates.md
          retention-days: 30

  # Update Python dependencies
  update-python-dependencies:
    name: Update Python Dependencies
    runs-on: ubuntu-latest
    needs: [python-dependency-check]
    if: needs.python-dependency-check.outputs.has_updates == 'true'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install pip-tools
        run: |
          pip install --upgrade pip
          pip install pip-tools
      
      - name: Update dependencies
        run: |
          cd backend
          
          UPDATE_TYPE="${{ github.event.inputs.update_type || 'patch' }}"
          
          case $UPDATE_TYPE in
            "patch")
              echo "Updating patch versions only..."
              pip-compile --upgrade-package "*" --resolver=backtracking requirements.in
              ;;
            "minor")
              echo "Updating minor versions..."
              pip-compile --upgrade --resolver=backtracking requirements.in
              ;;
            "major"|"all")
              echo "Updating all versions..."
              pip-compile --upgrade --resolver=backtracking requirements.in
              ;;
          esac
      
      - name: Test updated dependencies
        run: |
          cd backend
          
          # Install updated dependencies
          pip install -r requirements.txt
          
          # Run basic import tests
          python -c "
          import fastapi
          import sqlalchemy
          import redis
          import openai
          print('✅ All major dependencies import successfully')
          "
      
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          if git diff --quiet backend/requirements.txt; then
            echo "No changes to commit"
          else
            git add backend/requirements.txt
            git commit -m "chore: update Python dependencies (${{ github.event.inputs.update_type || 'patch' }})"
          fi

  # Update Node.js dependencies
  update-nodejs-dependencies:
    name: Update Node.js Dependencies
    runs-on: ubuntu-latest
    needs: [nodejs-dependency-check]
    if: needs.nodejs-dependency-check.outputs.has_updates == 'true'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Update dependencies
        run: |
          cd frontend
          
          UPDATE_TYPE="${{ github.event.inputs.update_type || 'patch' }}"
          
          case $UPDATE_TYPE in
            "patch")
              echo "Updating patch versions only..."
              npm update
              ;;
            "minor")
              echo "Updating minor versions..."
              npx npm-check-updates -u --target minor
              npm install
              ;;
            "major"|"all")
              echo "Updating all versions..."
              npx npm-check-updates -u
              npm install
              ;;
          esac
      
      - name: Test updated dependencies
        run: |
          cd frontend
          
          # Run type checking
          npm run type-check
          
          # Run build test
          npm run build
      
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          if git diff --quiet frontend/package.json frontend/package-lock.json; then
            echo "No changes to commit"
          else
            git add frontend/package.json frontend/package-lock.json
            git commit -m "chore: update Node.js dependencies (${{ github.event.inputs.update_type || 'patch' }})"
          fi

  # Run comprehensive tests after updates
  test-updated-dependencies:
    name: Test Updated Dependencies
    runs-on: ubuntu-latest
    needs: [update-python-dependencies, update-nodejs-dependencies]
    if: always() && (needs.update-python-dependencies.result == 'success' || needs.update-nodejs-dependencies.result == 'success')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start PostgreSQL
        run: |
          sudo systemctl start postgresql
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres';"
          sudo -u postgres psql -c "CREATE DATABASE test_db;"

      - name: Start Redis
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-server
          sudo systemctl start redis-server
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install Python dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run Python tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key
          MASTER_ENCRYPTION_KEY: test-encryption-key-32-characters
        run: |
          cd backend
          python -m pytest tests/ -v --tb=short
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install Node.js dependencies
        run: |
          cd frontend
          npm ci
      
      - name: Run Node.js tests
        run: |
          cd frontend
          npm run test:ci
      
      - name: Run build tests
        run: |
          cd frontend
          npm run build

  # Create pull request with updates
  create-update-pr:
    name: Create Update Pull Request
    runs-on: ubuntu-latest
    needs: [python-dependency-check, nodejs-dependency-check, update-python-dependencies, update-nodejs-dependencies, test-updated-dependencies]
    if: always() && (needs.python-dependency-check.outputs.has_updates == 'true' || needs.nodejs-dependency-check.outputs.has_updates == 'true') && needs.test-updated-dependencies.result == 'success' && (github.event.inputs.create_pr != 'false')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download dependency reports
        uses: actions/download-artifact@v4
        with:
          path: dependency-reports
      
      - name: Create comprehensive update summary
        run: |
          echo "# Dependency Updates" > update-summary.md
          echo "" >> update-summary.md
          echo "This PR contains automated dependency updates." >> update-summary.md
          echo "" >> update-summary.md
          
          # Add Python updates if available
          if [ -f dependency-reports/python-dependency-reports/python-updates.md ]; then
            cat dependency-reports/python-dependency-reports/python-updates.md >> update-summary.md
            echo "" >> update-summary.md
          fi
          
          # Add Node.js updates if available
          if [ -f dependency-reports/nodejs-dependency-reports/nodejs-updates.md ]; then
            cat dependency-reports/nodejs-dependency-reports/nodejs-updates.md >> update-summary.md
            echo "" >> update-summary.md
          fi
          
          echo "## Testing" >> update-summary.md
          echo "- ✅ All tests pass with updated dependencies" >> update-summary.md
          echo "- ✅ Build process completes successfully" >> update-summary.md
          echo "- ✅ Type checking passes" >> update-summary.md
          echo "" >> update-summary.md
          
          echo "## Security" >> update-summary.md
          echo "- Security audits have been run on all dependencies" >> update-summary.md
          echo "- Check the uploaded artifacts for detailed security reports" >> update-summary.md
          echo "" >> update-summary.md
          
          echo "## Review Checklist" >> update-summary.md
          echo "- [ ] Review breaking changes in updated packages" >> update-summary.md
          echo "- [ ] Check for any new security vulnerabilities" >> update-summary.md
          echo "- [ ] Verify all tests pass in CI" >> update-summary.md
          echo "- [ ] Test critical functionality manually" >> update-summary.md
          
          cat update-summary.md
      
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: automated dependency updates"
          title: "chore: automated dependency updates (${{ github.event.inputs.update_type || 'patch' }})"
          body-path: update-summary.md
          branch: chore/dependency-updates-${{ github.run_number }}
          delete-branch: true
          labels: |
            dependencies
            automated
          reviewers: |
            # Add your team members here
          assignees: |
            # Add assignees here

  # Security vulnerability check
  security-vulnerability-check:
    name: Security Vulnerability Check
    runs-on: ubuntu-latest
    needs: [python-dependency-check, nodejs-dependency-check]
    if: always()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download dependency reports
        uses: actions/download-artifact@v4
        with:
          path: dependency-reports
      
      - name: Analyze security reports
        run: |
          echo "=== Security Vulnerability Analysis ==="
          
          CRITICAL_VULNS=0
          HIGH_VULNS=0
          
          # Check Python security report
          if [ -f dependency-reports/python-dependency-reports/safety-report.json ]; then
            echo "Analyzing Python security vulnerabilities..."
            PYTHON_VULNS=$(jq length dependency-reports/python-dependency-reports/safety-report.json)
            echo "Found $PYTHON_VULNS Python vulnerabilities"
            
            if [ $PYTHON_VULNS -gt 0 ]; then
              jq -r '.[] | "- \(.package_name): \(.vulnerability_id) (\(.severity))"' dependency-reports/python-dependency-reports/safety-report.json
            fi
          fi
          
          # Check Node.js security report
          if [ -f dependency-reports/nodejs-dependency-reports/npm-audit-report.json ]; then
            echo "Analyzing Node.js security vulnerabilities..."
            
            CRITICAL_VULNS=$(jq '.metadata.vulnerabilities.critical // 0' dependency-reports/nodejs-dependency-reports/npm-audit-report.json)
            HIGH_VULNS=$(jq '.metadata.vulnerabilities.high // 0' dependency-reports/nodejs-dependency-reports/npm-audit-report.json)
            
            echo "Critical vulnerabilities: $CRITICAL_VULNS"
            echo "High vulnerabilities: $HIGH_VULNS"
          fi
          
          # Alert if critical vulnerabilities found
          if [ $CRITICAL_VULNS -gt 0 ]; then
            echo "🚨 CRITICAL: $CRITICAL_VULNS critical vulnerabilities found!"
            echo "critical_vulns=true" >> $GITHUB_ENV
          fi
          
          if [ $HIGH_VULNS -gt 5 ]; then
            echo "⚠️ WARNING: $HIGH_VULNS high-severity vulnerabilities found!"
            echo "high_vulns=true" >> $GITHUB_ENV
          fi
      
      - name: Create security issue
        if: env.critical_vulns == 'true'
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Critical Security Vulnerabilities Detected',
              body: `Critical security vulnerabilities have been detected in project dependencies.
              
              Please review the dependency reports and update vulnerable packages immediately.
              
              **Action Required:**
              1. Review the security reports in the latest dependency check workflow
              2. Update vulnerable dependencies
              3. Test the application thoroughly
              4. Deploy security updates as soon as possible
              
              **Workflow:** ${context.workflow}
              **Run:** ${context.runNumber}`,
              labels: ['security', 'critical', 'dependencies']
            });

  # Notify results
  notify-results:
    name: Notify Dependency Update Results
    runs-on: ubuntu-latest
    needs: [python-dependency-check, nodejs-dependency-check, create-update-pr, security-vulnerability-check]
    if: always()
    
    steps:
      - name: Notify success
        if: needs.create-update-pr.result == 'success'
        run: |
          echo "✅ Dependency updates completed successfully!"
          echo "- Python updates: ${{ needs.python-dependency-check.outputs.has_updates }}"
          echo "- Node.js updates: ${{ needs.nodejs-dependency-check.outputs.has_updates }}"
          echo "- Pull request created for review"
      
      - name: Notify no updates
        if: needs.python-dependency-check.outputs.has_updates == 'false' && needs.nodejs-dependency-check.outputs.has_updates == 'false'
        run: |
          echo "ℹ️ No dependency updates available"
          echo "All dependencies are up to date!"
      
      - name: Notify failure
        if: failure()
        run: |
          echo "❌ Dependency update process failed!"
          echo "Please check the workflow logs for details."
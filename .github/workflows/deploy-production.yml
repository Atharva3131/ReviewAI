name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Force deployment even if tests fail'
        required: false
        default: 'false'
        type: boolean

env:
  AWS_REGION: us-east-1
  PROJECT_NAME: revive-ai
  ECR_REPOSITORY: revive-ai-backend

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install backend dependencies
        run: |
          cd backend
          pip install -r requirements.txt
      
      - name: Run backend tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key
          MASTER_ENCRYPTION_KEY: test-encryption-key-32-characters
        run: |
          cd backend
          python -m pytest tests/ -v --tb=short
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci
      
      - name: Run frontend tests
        run: |
          cd frontend
          npm run test
      
      - name: Run frontend build
        run: |
          cd frontend
          npm run build

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
      
      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: [test, security-scan]
    if: success() || github.event.inputs.force_deploy == 'true'
    
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=prod-{{date 'YYYYMMDD-HHmmss'}}
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  deploy-infrastructure:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: success() || github.event.inputs.force_deploy == 'true'
    
    defaults:
      run:
        working-directory: aws/terraform
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0
      
      - name: Terraform Init
        run: terraform init
      
      - name: Terraform Plan
        run: |
          terraform plan \
            -var="aws_region=${{ env.AWS_REGION }}" \
            -var="environment=production" \
            -var="project_name=${{ env.PROJECT_NAME }}" \
            -var="domain_name=${{ secrets.DOMAIN_NAME }}" \
            -var="alert_email=${{ secrets.ALERT_EMAIL }}" \
            -out=tfplan
      
      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

  deploy-application:
    name: Deploy Application
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy-infrastructure]
    if: success() || github.event.inputs.force_deploy == 'true'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Update ECS Task Definition
        run: |
          # Get the latest image URI
          IMAGE_URI=$(echo "${{ needs.build-and-push.outputs.image-tag }}" | head -n1)
          
          # Update task definition with new image
          aws ecs describe-task-definition \
            --task-definition ${{ env.PROJECT_NAME }}-backend \
            --query taskDefinition > task-def.json
          
          # Update the image URI in the task definition
          jq --arg IMAGE_URI "$IMAGE_URI" \
             '.containerDefinitions[0].image = $IMAGE_URI' \
             task-def.json > updated-task-def.json
          
          # Remove unnecessary fields
          jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .placementConstraints, .compatibilities, .registeredAt, .registeredBy)' \
             updated-task-def.json > final-task-def.json
          
          # Register new task definition
          aws ecs register-task-definition \
            --cli-input-json file://final-task-def.json
      
      - name: Update ECS Service
        run: |
          aws ecs update-service \
            --cluster ${{ env.PROJECT_NAME }}-cluster \
            --service ${{ env.PROJECT_NAME }}-backend \
            --task-definition ${{ env.PROJECT_NAME }}-backend \
            --force-new-deployment
      
      - name: Wait for Service Stability
        run: |
          aws ecs wait services-stable \
            --cluster ${{ env.PROJECT_NAME }}-cluster \
            --services ${{ env.PROJECT_NAME }}-backend
      
      - name: Run automated database migration
        run: |
          # Get subnet and security group IDs
          SUBNET_ID=$(aws ec2 describe-subnets \
            --filters "Name=tag:Name,Values=${{ env.PROJECT_NAME }}-private-subnet-1" \
            --query 'Subnets[0].SubnetId' --output text)
          
          SECURITY_GROUP_ID=$(aws ec2 describe-security-groups \
            --filters "Name=tag:Name,Values=${{ env.PROJECT_NAME }}-ecs-sg" \
            --query 'SecurityGroups[0].GroupId' --output text)
          
          # Run migration task using automated script
          TASK_ARN=$(aws ecs run-task \
            --cluster ${{ env.PROJECT_NAME }}-cluster \
            --task-definition ${{ env.PROJECT_NAME }}-backend \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNET_ID],securityGroups=[$SECURITY_GROUP_ID],assignPublicIp=DISABLED}" \
            --overrides '{"containerOverrides":[{"name":"${{ env.PROJECT_NAME }}-backend","command":["python","scripts/migrate.py","--environment","production","--report","migration_report.json"]}]}' \
            --query 'tasks[0].taskArn' --output text)
          
          echo "MIGRATION_TASK_ARN=$TASK_ARN" >> $GITHUB_ENV
          
          # Wait for migration to complete
          aws ecs wait tasks-stopped \
            --cluster ${{ env.PROJECT_NAME }}-cluster \
            --tasks $TASK_ARN
          
          # Check migration result
          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster ${{ env.PROJECT_NAME }}-cluster \
            --tasks $TASK_ARN \
            --query 'tasks[0].containers[0].exitCode' --output text)
          
          if [ "$EXIT_CODE" != "0" ]; then
            echo "❌ Automated migration failed with exit code: $EXIT_CODE"
            exit 1
          fi
          
          echo "✓ Automated migration completed successfully"
      
      - name: Get migration logs
        if: always()
        run: |
          LOG_GROUP="/ecs/${{ env.PROJECT_NAME }}-backend"
          TASK_ID=$(echo "${{ env.MIGRATION_TASK_ARN }}" | cut -d'/' -f3)
          LOG_STREAM_NAME="ecs/${{ env.PROJECT_NAME }}-backend/${TASK_ID}"
          
          echo "Fetching migration logs..."
          aws logs get-log-events \
            --log-group-name "$LOG_GROUP" \
            --log-stream-name "$LOG_STREAM_NAME" \
            --query 'events[].message' \
            --output text || echo "Could not fetch logs"

  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: [deploy-infrastructure]
    if: success() || github.event.inputs.force_deploy == 'true'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
      
      - name: Build frontend
        env:
          NEXT_PUBLIC_API_URL: https://api.${{ secrets.DOMAIN_NAME }}
          NEXT_PUBLIC_APP_URL: https://app.${{ secrets.DOMAIN_NAME }}
        run: |
          cd frontend
          npm run build
      
      - name: Deploy to S3
        run: |
          # Get S3 bucket name
          S3_BUCKET=$(aws s3api list-buckets \
            --query "Buckets[?contains(Name, '${{ env.PROJECT_NAME }}-frontend')].Name" \
            --output text)
          
          # Upload to S3
          cd frontend
          aws s3 sync out/ s3://$S3_BUCKET/ --delete
      
      - name: Invalidate CloudFront
        run: |
          # Get CloudFront distribution ID
          DISTRIBUTION_ID=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?Comment=='${{ env.PROJECT_NAME }} frontend distribution'].Id" \
            --output text)
          
          # Create invalidation
          aws cloudfront create-invalidation \
            --distribution-id $DISTRIBUTION_ID \
            --paths "/*"

  health-check:
    name: Health Check
    runs-on: ubuntu-latest
    needs: [deploy-application, deploy-frontend]
    if: success() || github.event.inputs.force_deploy == 'true'
    
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Wait for deployment
        run: sleep 60
      
      - name: Check backend health
        run: |
          # Get ALB DNS name
          ALB_DNS=$(aws elbv2 describe-load-balancers \
            --names ${{ env.PROJECT_NAME }}-alb \
            --query 'LoadBalancers[0].DNSName' --output text)
          
          # Health check with retries
          for i in {1..30}; do
            if curl -f -s "https://$ALB_DNS/health" > /dev/null; then
              echo "✅ Backend health check passed"
              break
            else
              echo "⏳ Waiting for backend to be healthy... (attempt $i/30)"
              sleep 10
            fi
            
            if [ $i -eq 30 ]; then
              echo "❌ Backend health check failed after 5 minutes"
              exit 1
            fi
          done
      
      - name: Check frontend
        run: |
          # Check if frontend is accessible
          if curl -f -s "https://app.${{ secrets.DOMAIN_NAME }}" > /dev/null; then
            echo "✅ Frontend health check passed"
          else
            echo "⚠️ Frontend health check failed, but this might be due to DNS propagation"
          fi

  notify:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [health-check]
    if: always()
    
    steps:
      - name: Notify Success
        if: needs.health-check.result == 'success'
        run: |
          echo "🎉 Production deployment completed successfully!"
          echo "Application is available at:"
          echo "  - API: https://api.${{ secrets.DOMAIN_NAME }}"
          echo "  - App: https://app.${{ secrets.DOMAIN_NAME }}"
          echo "  - Root: https://${{ secrets.DOMAIN_NAME }}"
      
      - name: Notify Failure
        if: needs.health-check.result == 'failure'
        run: |
          echo "❌ Production deployment failed!"
          echo "Please check the logs and fix any issues."
          exit 1
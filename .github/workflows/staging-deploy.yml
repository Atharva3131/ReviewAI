name: Deploy to Staging

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - dev

env:
  AWS_REGION: us-east-1
  PROJECT_NAME: revive-ai
  ECR_REPOSITORY: revive-ai-backend

jobs:
  # Run tests before deployment
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start PostgreSQL
        run: |
          sudo systemctl start postgresql
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres';"
          sudo -u postgres psql -c "CREATE DATABASE test_db;"

      - name: Start Redis
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-server
          sudo systemctl start redis-server
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install backend dependencies
        run: |
          cd backend
          pip install -r requirements.txt
      
      - name: Run backend tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key
          MASTER_ENCRYPTION_KEY: test-encryption-key-32-characters
        run: |
          cd backend
          python -m pytest tests/ -v --tb=short
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci
      
      - name: Run frontend tests
        run: |
          cd frontend
          npm run test:ci

  # Build and push Docker images
  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest
    needs: [test]
    
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=staging-
            type=raw,value=staging-latest
            type=raw,value=staging-{{date 'YYYYMMDD-HHmmss'}}
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build and push backend image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  # Deploy to staging environment
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-and-push]
    environment: 
      name: ${{ github.event.inputs.environment || 'staging' }}
      url: https://staging-api.revive-ai.com
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Deploy infrastructure
        working-directory: aws/terraform
        run: |
          terraform init
          terraform workspace select staging || terraform workspace new staging
          terraform plan \
            -var="aws_region=${{ env.AWS_REGION }}" \
            -var="environment=staging" \
            -var="project_name=${{ env.PROJECT_NAME }}" \
            -var="domain_name=staging.revive-ai.com" \
            -var="alert_email=${{ secrets.ALERT_EMAIL }}" \
            -out=tfplan
          terraform apply -auto-approve tfplan
      
      - name: Update ECS service
        run: |
          # Get the latest image URI
          IMAGE_URI=$(echo "${{ needs.build-and-push.outputs.image-tag }}" | head -n1)
          
          # Update task definition
          aws ecs describe-task-definition \
            --task-definition ${{ env.PROJECT_NAME }}-staging-backend \
            --query taskDefinition > task-def.json
          
          # Update image URI
          jq --arg IMAGE_URI "$IMAGE_URI" \
             '.containerDefinitions[0].image = $IMAGE_URI' \
             task-def.json > updated-task-def.json
          
          # Clean up task definition
          jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .placementConstraints, .compatibilities, .registeredAt, .registeredBy)' \
             updated-task-def.json > final-task-def.json
          
          # Register new task definition
          aws ecs register-task-definition \
            --cli-input-json file://final-task-def.json
          
          # Update service
          aws ecs update-service \
            --cluster ${{ env.PROJECT_NAME }}-staging-cluster \
            --service ${{ env.PROJECT_NAME }}-staging-backend \
            --task-definition ${{ env.PROJECT_NAME }}-staging-backend \
            --force-new-deployment
      
      - name: Run database migrations
        run: |
          # Get network configuration
          SUBNET_ID=$(aws ec2 describe-subnets \
            --filters "Name=tag:Name,Values=${{ env.PROJECT_NAME }}-staging-private-subnet-1" \
            --query 'Subnets[0].SubnetId' --output text)
          
          SECURITY_GROUP_ID=$(aws ec2 describe-security-groups \
            --filters "Name=tag:Name,Values=${{ env.PROJECT_NAME }}-staging-ecs-sg" \
            --query 'SecurityGroups[0].GroupId' --output text)
          
          # Run migration
          TASK_ARN=$(aws ecs run-task \
            --cluster ${{ env.PROJECT_NAME }}-staging-cluster \
            --task-definition ${{ env.PROJECT_NAME }}-staging-backend \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNET_ID],securityGroups=[$SECURITY_GROUP_ID],assignPublicIp=DISABLED}" \
            --overrides '{"containerOverrides":[{"name":"${{ env.PROJECT_NAME }}-staging-backend","command":["alembic","upgrade","head"]}]}' \
            --query 'tasks[0].taskArn' --output text)
          
          # Wait for completion
          aws ecs wait tasks-stopped \
            --cluster ${{ env.PROJECT_NAME }}-staging-cluster \
            --tasks $TASK_ARN
          
          # Check result
          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster ${{ env.PROJECT_NAME }}-staging-cluster \
            --tasks $TASK_ARN \
            --query 'tasks[0].containers[0].exitCode' --output text)
          
          if [ "$EXIT_CODE" != "0" ]; then
            echo "Migration failed with exit code: $EXIT_CODE"
            exit 1
          fi

  # Deploy frontend to staging
  deploy-frontend:
    name: Deploy Frontend to Staging
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
      
      - name: Build frontend
        env:
          NEXT_PUBLIC_API_URL: https://staging-api.revive-ai.com
          NEXT_PUBLIC_APP_URL: https://staging.revive-ai.com
        run: |
          cd frontend
          npm run build
      
      - name: Deploy to S3
        run: |
          # Get staging S3 bucket
          S3_BUCKET=$(aws s3api list-buckets \
            --query "Buckets[?contains(Name, '${{ env.PROJECT_NAME }}-staging-frontend')].Name" \
            --output text)
          
          # Upload to S3
          cd frontend
          aws s3 sync out/ s3://$S3_BUCKET/ --delete
      
      - name: Invalidate CloudFront
        run: |
          # Get staging CloudFront distribution
          DISTRIBUTION_ID=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?Comment=='${{ env.PROJECT_NAME }} staging frontend distribution'].Id" \
            --output text)
          
          # Create invalidation
          aws cloudfront create-invalidation \
            --distribution-id $DISTRIBUTION_ID \
            --paths "/*"

  # Run smoke tests
  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: [deploy-staging, deploy-frontend]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Wait for deployment
        run: sleep 60
      
      - name: Health check
        run: |
          # Check backend health
          for i in {1..10}; do
            if curl -f -s "https://staging-api.revive-ai.com/health" > /dev/null; then
              echo "✅ Backend health check passed"
              break
            else
              echo "⏳ Waiting for backend... (attempt $i/10)"
              sleep 30
            fi
            
            if [ $i -eq 10 ]; then
              echo "❌ Backend health check failed"
              exit 1
            fi
          done
          
          # Check frontend
          if curl -f -s "https://staging.revive-ai.com" > /dev/null; then
            echo "✅ Frontend health check passed"
          else
            echo "⚠️ Frontend health check failed"
          fi
      
      - name: Set up Node.js for E2E tests
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
          npx playwright install --with-deps
      
      - name: Run smoke tests
        env:
          PLAYWRIGHT_BASE_URL: https://staging.revive-ai.com
          API_BASE_URL: https://staging-api.revive-ai.com
        run: |
          cd frontend
          npx playwright test e2e/smoke.spec.ts --reporter=html
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staging-smoke-test-results
          path: frontend/playwright-report/
          retention-days: 7

  # Notify deployment status
  notify:
    name: Notify Deployment
    runs-on: ubuntu-latest
    needs: [smoke-tests]
    if: always()
    
    steps:
      - name: Notify Success
        if: needs.smoke-tests.result == 'success'
        run: |
          echo "🎉 Staging deployment completed successfully!"
          echo "Application is available at:"
          echo "  - API: https://staging-api.revive-ai.com"
          echo "  - App: https://staging.revive-ai.com"
      
      - name: Notify Failure
        if: needs.smoke-tests.result == 'failure'
        run: |
          echo "❌ Staging deployment failed!"
          echo "Please check the logs and fix any issues."
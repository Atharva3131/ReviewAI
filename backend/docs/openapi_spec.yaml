openapi: 3.0.3
info:
  title: Revive AI API
  description: |
    AI-Powered Reputation Intelligence & Customer Recovery Platform
    
    ## Overview
    Revive AI helps businesses monitor public reviews, analyze customer conversations,
    predict churn risks, and take automated recovery actions to improve ratings,
    retention, and revenue.
    
    ## Authentication
    All endpoints require JWT Bearer token authentication (except public endpoints).
    Include the token in the Authorization header: `Bearer <token>`
  version: 1.0.0
  contact:
    name: Revive AI Support
    email: support@revive-ai.com
    url: https://revive-ai.com/support
  license:
    name: Proprietary License
    url: https://revive-ai.com/license
  termsOfService: https://revive-ai.com/terms

servers:
  - url: http://localhost:8000
    description: Development server
  - url: https://staging-api.revive-ai.com
    description: Staging server
  - url: https://api.revive-ai.com
    description: Production server

tags:
  - name: authentication
    description: Authentication and authorization endpoints
  - name: reviews
    description: Review intelligence and management
  - name: customers
    description: Customer management and recovery
  - name: agents
    description: Agent orchestration and decisions
  - name: dashboard
    description: Dashboard metrics and analytics
  - name: users
    description: User management
  - name: webhooks
    description: Webhook management
  - name: health
    description: Health check and system status

security:
  - BearerAuth: []

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT Bearer token authentication

  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            type:
              type: string
              example: validation_error
            message:
              type: string
              example: Request validation failed
            status_code:
              type: integer
              example: 422
            request_id:
              type: string
              format: uuid
            timestamp:
              type: number
              format: float
            path:
              type: string
              example: /api/v1/reviews


    Review:
      type: object
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        platform:
          type: string
          enum: [google, yelp, facebook, trustpilot]
        external_id:
          type: string
        customer_name:
          type: string
        rating:
          type: integer
          minimum: 1
          maximum: 5
        content:
          type: string
        sentiment_score:
          type: number
          format: float
          minimum: 0
          maximum: 1
        urgency_level:
          type: string
          enum: [low, medium, high]
        issue_categories:
          type: array
          items:
            type: string
            enum: [support, pricing, delivery, quality]
        status:
          type: string
          enum: [pending, responded, escalated]
        requires_private_recovery:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ReviewIngest:
      type: object
      required:
        - platform
        - rating
        - content
      properties:
        platform:
          type: string
        external_id:
          type: string
        customer_name:
          type: string
        rating:
          type: integer
          minimum: 1
          maximum: 5
        content:
          type: string
        created_at:
          type: string
          format: date-time

    Customer:
      type: object
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        phone:
          type: string
        name:
          type: string
        churn_risk_score:
          type: number
          format: float
          minimum: 0
          maximum: 1
        bad_review_likelihood:
          type: number
          format: float
          minimum: 0
          maximum: 1
        last_interaction:
          type: string
          format: date-time
        context_summary:
          type: string

    DashboardMetrics:
      type: object
      properties:
        kpis:
          type: object
          properties:
            average_rating:
              type: object
              properties:
                value:
                  type: number
                change:
                  type: number
                trend:
                  type: string
                  enum: [up, down, stable]
            monthly_reviews:
              type: object
              properties:
                value:
                  type: integer
                change:
                  type: integer
                trend:
                  type: string
            at_risk_customers:
              type: object
              properties:
                value:
                  type: integer
                change:
                  type: integer
                trend:
                  type: string
            recovery_success_rate:
              type: object
              properties:
                value:
                  type: number
                change:
                  type: number
                trend:
                  type: string

paths:
  /health:
    get:
      tags:
        - health
      summary: Health check
      description: Comprehensive health check for all system components
      security: []
      responses:
        '200':
          description: System is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
                  service:
                    type: string
                  version:
                    type: string
                  components:
                    type: object

  /api/v1/auth/register:
    post:
      tags:
        - authentication
      summary: Register new account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - organization_name
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                organization_name:
                  type: string
      responses:
        '201':
          description: Account created successfully
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/auth/login:
    post:
      tags:
        - authentication
      summary: Login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  token_type:
                    type: string
                    example: bearer
                  expires_in:
                    type: integer
                    example: 3600

  /api/v1/reviews/ingest:
    post:
      tags:
        - reviews
      summary: Ingest new review
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewIngest'
      responses:
        '201':
          description: Review ingested successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  review_id:
                    type: string
                  sentiment_score:
                    type: number
                  urgency_level:
                    type: string
                  issue_categories:
                    type: array
                    items:
                      type: string

  /api/v1/reviews:
    get:
      tags:
        - reviews
      summary: List reviews
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 20
        - name: rating
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 5
        - name: urgency_level
          in: query
          schema:
            type: string
            enum: [low, medium, high]
      responses:
        '200':
          description: List of reviews
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Review'
                  total:
                    type: integer
                  page:
                    type: integer
                  page_size:
                    type: integer

  /api/v1/dashboard/metrics:
    get:
      tags:
        - dashboard
      summary: Get dashboard metrics
      parameters:
        - name: period
          in: query
          schema:
            type: string
            enum: [7d, 30d, 90d, 1y]
            default: 30d
      responses:
        '200':
          description: Dashboard metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardMetrics'
